# ScreenGarden CI
#
# Runs on every pull request and on pushes to main. A red check here means the
# branch does not build, is not formatted, regressed lint, or failed tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs, but never cancel a run on main: a
  # cancelled run on a pushed commit looks like a failure in the history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK. We deliberately do NOT
      # use android-actions/setup-android: its install step runs `sdkmanager
      # tools`, which fails on newer cmdline-tools with
      # "Warning: Failed to find package 'tools'" and exits 1. Installing the
      # three packages this build actually needs is both faster and stable.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      # The wrapper can lose its executable bit when the repo is first pushed
      # from Windows, so set it here rather than depending on the checkout mode.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # --no-build-cache: the Gradle build cache can replay a stale ktlint result
      # for files that were deleted in this change (see AGENT_MEMORY K14), which
      # would report violations for files that no longer exist.
      - name: Kotlin style (ktlint)
        run: ./gradlew ktlintCheck --no-build-cache --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Repository rules
        shell: pwsh
        run: ./scripts/Check-Repository.ps1 -Manifest app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screengarden-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screengarden-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
