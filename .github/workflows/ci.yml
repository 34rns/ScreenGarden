# ScreenGarden CI
#
# Runs on every pull request and on pushes to main. A red check here means the
# branch does not build, is not formatted, regressed lint, or failed tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper can lose its executable bit when the repo is first pushed
      # from Windows, so set it here rather than depending on the checkout mode.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # --no-build-cache: the Gradle build cache can replay a stale ktlint result
      # for files that were deleted in this change (see AGENT_MEMORY K14), which
      # would report violations for files that no longer exist.
      - name: Kotlin style (ktlint)
        run: ./gradlew ktlintCheck --no-build-cache --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screengarden-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screengarden-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
