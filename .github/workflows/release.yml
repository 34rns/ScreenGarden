# ScreenGarden release build
#
# Separate from ci.yml on purpose: pull requests stay fast and debug-only, while
# a full R8 release build runs on demand and once a week. Both are free on a
# public repository (GitHub Actions standard runners).
#
# The APK is UNSIGNED. Signing is a later task (see AGENT_MEMORY D34): generate a
# keystore locally with keytool and store it only in GitHub Secrets. Nothing in
# this workflow needs a paid service.
name: Release build

on:
  # Manual trigger from the Actions tab or `gh workflow run release.yml`.
  workflow_dispatch:
  schedule:
    # Every Monday at 04:00 UTC: catches R8/consumer-rule regressions that a
    # debug-only build cannot see, without slowing down pull requests.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    name: Assemble unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper can lose its executable bit when the repo is first pushed
      # from Windows, so set it here rather than depending on the checkout mode.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: screengarden-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # The R8 mapping file is what makes a stack trace from a release build
      # readable. Keep it with the artifact so it can be deobfuscated later.
      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: screengarden-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
