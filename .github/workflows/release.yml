name: Signed GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate version or main preflight
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.properties | Where-Object { $_ -like 'versionName=*' }).Split('=')[1]
          $tag = "v$version"
          $preflight = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -eq 'main'
          if (!$preflight -and ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $tag)) {
            throw 'Use a version-matching tag or a manual main preflight; preflight does not publish.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Run every quality gate before signing
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ktlintCheck --no-build-cache
          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:lintDebug
          ./gradlew :app:assembleDebug

      - name: Check repository rules
        shell: pwsh
        run: ./scripts/Check-Repository.ps1 -Manifest app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml

      - name: Restore private signing file
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure the four release signing secrets described in docs/RELEASING.md. No values are displayed."
            exit 1
          fi
          mkdir -p .release
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .release/signing-key.jks

      - name: Build signed optimized APK and lint release
        env:
          SG_RELEASE_STORE_FILE: ${{ github.workspace }}/.release/signing-key.jks
          SG_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SG_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SG_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-build-cache

      - name: Verify production manifest
        shell: pwsh
        run: ./scripts/Check-Repository.ps1 -Release -Manifest app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Verify and stage public files
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          cp "$APK" "dist/ScreenGarden-${RELEASE_TAG}.apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          cp docs/releases/"${RELEASE_TAG}.md" dist/release-notes.md
          printf 'Source: https://github.com/34rns/ScreenGarden/tree/%s\nCommit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/source.txt
          (cd dist && sha256sum "ScreenGarden-${RELEASE_TAG}.apk" mapping.txt signature.txt source.txt > SHA256SUMS.txt)

      - name: Upload verified release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove private signing file
        if: always()
        run: rm -f -- .release/signing-key.jks

  publish:
    needs: verify-and-sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download only verified public files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "ScreenGarden-${RELEASE_TAG}.apk" SHA256SUMS.txt signature.txt source.txt mapping.txt --verify-tag --title "ScreenGarden $RELEASE_TAG" --notes-file release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
